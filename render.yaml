# Render blueprint. MONGO_URI is typed into the Render dashboard,
# SESSION_SECRET is generated by Render itself.

services:
  - type: web
    name: smart-crop-management-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
